# Sample Test Plan: AXI4-Lite Slave Verification
# A complete working test plan with 4 features and 15 items

project: "AXI4-Lite Slave"
version: "1.0"

features:
  - name: "Reset and Initialization"
    description: "Verify reset behavior and register initialization"
    items:
      - id: "TP_RST_001"
        description: "Hardware reset initializes all registers to defaults"
        priority: "P0"
        category: "reset"
        coverage_link: "cg_reset.cp_reg_defaults"
        test_link: "axi4_lite_smoke_test"
        status: "Done"
        spec_section: "2.1"
      - id: "TP_RST_002"
        description: "Soft reset clears status registers"
        priority: "P1"
        category: "reset"
        coverage_link: "cg_reset.cp_soft_reset"
        test_link: "axi4_lite_sanity_test"
        status: "Done"
        spec_section: "2.2"
      - id: "TP_RST_003"
        description: "Reset during active transaction completes gracefully"
        priority: "P1"
        category: "reset"
        coverage_link: "cg_reset.cp_reset_during_txn"
        test_link: "axi4_lite_error_test"
        status: "In Progress"
        spec_section: "2.3"

  - name: "Register Access"
    description: "Verify register read, write, and access policies"
    items:
      - id: "TP_REG_001"
        description: "Read ID register returns correct value (0xDEAD_BEEF)"
        priority: "P0"
        category: "register"
        coverage_link: "cg_axi.cp_addr.reg_id"
        test_link: "axi4_lite_sanity_test"
        status: "Done"
        spec_section: "3.1"
      - id: "TP_REG_002"
        description: "Write and readback all RW registers"
        priority: "P0"
        category: "register"
        coverage_link: "cg_axi.cp_addr.all_rw"
        test_link: "axi4_lite_directed_test"
        status: "Done"
        spec_section: "3.2"
      - id: "TP_REG_003"
        description: "Write to RO register has no effect"
        priority: "P1"
        category: "register"
        coverage_link: "cg_axi.cp_access.ro_protect"
        test_link: "axi4_lite_directed_test"
        status: "Done"
        spec_section: "3.3"
      - id: "TP_REG_004"
        description: "Address decode covers full register map"
        priority: "P1"
        category: "register"
        coverage_link: "cg_axi.cp_addr"
        test_link: "axi4_lite_random_test"
        status: "Done"
        spec_section: "3.4"
      - id: "TP_REG_005"
        description: "Invalid address returns SLVERR"
        priority: "P1"
        category: "register"
        coverage_link: "cg_axi.cp_resp.slverr"
        test_link: "axi4_lite_error_test"
        status: "In Progress"
        spec_section: "3.5"

  - name: "Error Handling"
    description: "Protocol error detection and response verification"
    items:
      - id: "TP_ERR_001"
        description: "Unmapped address access returns DECERR"
        priority: "P0"
        category: "error"
        coverage_link: "cg_axi.cp_resp.decerr"
        test_link: "axi4_lite_error_test"
        status: "Done"
        spec_section: "4.1"
      - id: "TP_ERR_002"
        description: "Unaligned 32-bit access returns SLVERR"
        priority: "P1"
        category: "error"
        coverage_link: "cg_error.cp_unaligned"
        test_link: "axi4_lite_error_test"
        status: "In Progress"
        spec_section: "4.2"
      - id: "TP_ERR_003"
        description: "Timeout on stalled slave response"
        priority: "P2"
        category: "error"
        coverage_link: "cg_error.cp_timeout"
        test_link: ""
        status: "Not Started"
        spec_section: "4.3"

  - name: "Performance and Throughput"
    description: "Bandwidth, latency, and back-pressure verification"
    items:
      - id: "TP_PERF_001"
        description: "Single-cycle read latency for register access"
        priority: "P1"
        category: "performance"
        coverage_link: "cg_perf.cp_rd_latency"
        test_link: "axi4_lite_sanity_test"
        status: "Done"
        spec_section: "5.1"
      - id: "TP_PERF_002"
        description: "Back-to-back write throughput meets 1 write/cycle"
        priority: "P1"
        category: "performance"
        coverage_link: "cg_perf.cp_wr_throughput"
        test_link: "axi4_lite_random_test"
        status: "In Progress"
        spec_section: "5.2"
      - id: "TP_PERF_003"
        description: "READY back-pressure handled without data loss"
        priority: "P1"
        category: "performance"
        coverage_link: "cg_perf.cp_backpressure"
        test_link: "axi4_lite_backpressure_test"
        status: "In Progress"
        spec_section: "5.3"
      - id: "TP_PERF_004"
        description: "Concurrent read and write channels operate independently"
        priority: "P2"
        category: "performance"
        coverage_link: ""
        test_link: ""
        status: "Not Started"
        spec_section: "5.4"
